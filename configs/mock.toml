[judge]
provider = "mock"

[profiles.baseline]
model = { provider = "mock" }
retrieval = { mode = "none" }
mcp = { mode = "none" }

[profiles.direct]
model = { provider = "mock" }
retrieval = { mode = "direct-file", files = ["../common/data/policy.txt"] }
mcp = { mode = "none" }

[profiles.search]
model = { provider = "mock" }
retrieval = { mode = "fixture-search", path = "../common/data/search-fixture.json", top_k = 3 }
mcp = { mode = "none" }

[profiles.tool]
model = { provider = "mock" }
retrieval = { mode = "none" }
mcp = { mode = "fixture", tool = "lookup_policy", path = "../common/data/policy.txt" }


[matrix.models]
mock_a = { provider = "mock", id = "fixture-a" }
mock_b = { provider = "mock", id = "fixture-b" }

[matrix.retrievals]
external = { mode = "fixture-search", path = "../common/data/search-fixture.json", top_k = 3 }
direct = { mode = "direct-file", files = ["../common/data/policy.txt"] }
