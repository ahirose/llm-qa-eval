[judge]
provider = "openai"
id = "REPLACE_WITH_JUDGE_MODEL_ID"
max_tokens = 2048

[profiles.baseline]
model = { provider = "openai", id = "REPLACE_WITH_OPENAI_MODEL_ID" }
retrieval = { mode = "none" }
mcp = { mode = "none" }

[profiles.direct]
model = { provider = "openai", id = "REPLACE_WITH_OPENAI_MODEL_ID" }
retrieval = { mode = "direct-file", files = ["../common/data/policy.txt"] }
mcp = { mode = "none" }

[profiles.search]
model = { provider = "openai", id = "REPLACE_WITH_OPENAI_MODEL_ID" }
retrieval = { mode = "external-search", top_k = 3, url_env = "HARNESS_SEARCH_URL", token_env = "HARNESS_SEARCH_TOKEN" }
mcp = { mode = "none" }

[profiles.tool]
model = { provider = "openai", id = "REPLACE_WITH_OPENAI_MODEL_ID" }
retrieval = { mode = "none" }
mcp = { mode = "remote", url_env = "HARNESS_MCP_URL", token_env = "HARNESS_MCP_TOKEN", tool = "REPLACE_WITH_TOOL_NAME", question_arg = "query", arguments = {} }

[profiles.claude_direct]
model = { provider = "anthropic", id = "REPLACE_WITH_CLAUDE_MODEL_ID" }
retrieval = { mode = "direct-file", files = ["../common/data/policy.txt"] }
mcp = { mode = "none" }


[matrix.models]
openai = { provider = "openai", id = "REPLACE_WITH_OPENAI_MODEL_ID" }
claude = { provider = "anthropic", id = "REPLACE_WITH_CLAUDE_MODEL_ID" }

[matrix.retrievals]
external = { mode = "external-search", top_k = 3, url_env = "HARNESS_SEARCH_URL", token_env = "HARNESS_SEARCH_TOKEN" }
direct = { mode = "direct-file", files = ["../common/data/policy.txt"] }
